<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEVEL COMPLETED</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #202020;
    color: white;
    height: 100vh;
    overflow: hidden;
}

#game {
    display: flex;
    height: 100vh;
    width: 100%;
}


#boardArea {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #181818;
}

#board {
    width: min(80vh, 80vw);
    height: min(80vh, 80vw);

    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);

    border: 4px solid #555;
    background: #aaa;
}

.cell {
    border: 1px solid #777;
    background: #d0d0d0;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
}

.wall {
    background: #333;
}

.target {
    background: #35b94b;
}

.robot {
    width: 65%;
    height: 65%;
    background: #2878ff;
    border-radius: 12%;
    position: relative;

    display: flex;
    justify-content: center;
    align-items: center;

    transition: transform 0.15s ease;
}

.robot::after {
    content: "";
    position: absolute;

    width: 0;
    height: 0;

    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-bottom: 20px solid white;

    top: 7px;
}


.cell {
    position: relative;
}

.beacon {
    position: absolute;
    width: 10px;
    height: 10px;
    background: blue;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    pointer-events: none;
}

.robot {
    position: relative;
    z-index: 2;
}



#side {
    width: 390px;
    background: #252525;
    display: flex;
    flex-direction: column;
    border-left: 2px solid #444;
}

#title {
    padding: 15px;
    font-size: 22px;
    font-weight: bold;
    background: #303030;
}

#editor {
    flex: 1;
    width: 100%;
    resize: none;

    border: none;
    outline: none;

    background: #111;
    color: #eee;

    font-family: Consolas, monospace;
    font-size: 15px;

    padding: 15px;

    line-height: 1.5;
}

#buttons {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #303030;
}

button {
    flex: 1;

    border: none;
    padding: 12px;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
    border-radius: 5px;
}

#runBtn {
    background: #35b94b;
    color: white;
}



#resetBtn {
    background: #777;
    color: white;
}

button:hover {
    filter: brightness(1.15);
}

#status {
    padding: 8px 12px;
    background: #181818;
    color: #bbb;
    font-family: Consolas, monospace;
    font-size: 13px;
    min-height: 35px;
}

#error {
    color: #ff6666;
    white-space: pre-wrap;
}

@media (max-width: 800px) {
    body {
        overflow: auto;
    }

    #game {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
    }

    #boardArea {
        height: 60vh;
        min-height: 400px;
    }

    #side {
        width: 100%;
        height: 40vh;
        min-height: 350px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="boardArea">
<style>

.blink-color {
    animation: colorChange 1s infinite;
}

@keyframes colorChange {
    0%   { color: red; }
    25%  { color: yellow; }
    50%  { color: lime; }
    75%  { color: cyan; }
    100% { color: red; }
}
</style>

<p class="blink-color"; style= "font-size: 70px">ALL LEVEL HAS COMPLETED</p>

    </div>

    <div id="side">

        <div id="title">
           LEVEL COMPLETED
        </div>

<textarea id="editor">SELAMAT KAMU SUDAH MENYELESAIKAN SEMUA LEVEL !!
</textarea>
        <div id="buttons">
            <button id="runBtn">Run</button>

            <button id="resetBtn">Reset</button>
        </div>

    </div>

</div>
